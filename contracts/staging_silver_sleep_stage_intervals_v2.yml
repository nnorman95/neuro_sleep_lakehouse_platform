version: "v2"

contract_name: "staging_silver_sleep_stage_intervals_contract"

table:
  schema: "staging"
  name: "silver_sleep_stage_intervals"
  layer: "staging"

owner_role: "data_engineer"

description: "Landing contract for source annotation intervals; onset may be negative when an annotation begins before the PSG boundary."

columns:
  - {name: "interval_id", type: "uuid", nullable: false}
  - {name: "recording_id", type: "uuid", nullable: false}
  - {name: "source_annotation_index", type: "integer", nullable: false}
  - {name: "onset_seconds", type: "double precision", nullable: false}
  - {name: "duration_seconds", type: "double precision", nullable: false}
  - {name: "end_seconds", type: "double precision", nullable: false}
  - {name: "source_label", type: "text", nullable: false}
  - {name: "normalized_stage", type: "text", nullable: false}
  - {name: "overlap_status", type: "text", nullable: false}

constraints:
  primary_key:
    - "interval_id"

  checks:
    - "source_annotation_index >= 0"
    - "duration_seconds > 0"
    - "end_seconds > onset_seconds"

relationships:
  - column: "recording_id"
    references:
      schema: "staging"
      table: "silver_recordings"
      column: "recording_id"

data_sensitivity:
  contains_personal_data: false
  contains_health_data: true
  contains_direct_identifier: false
  classification_level: "confidential"
  access_policy: "restricted"
  masking_policy: "none"
