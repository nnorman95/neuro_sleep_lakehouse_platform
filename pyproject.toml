[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-sleep-lakehouse-platform"
version = "0.2.0"
description = "A local neuroscience sleep data lakehouse platform for data engineering practice."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "boto3>=1.34",
    "uuid6==2025.0.1",
    "edfio==0.4.13",
    "numpy>=1.22",
    "pyarrow==25.0.0",
    "xlrd==2.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
