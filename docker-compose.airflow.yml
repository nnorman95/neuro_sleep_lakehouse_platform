x-airflow-common: &airflow-common
  image: ${AIRFLOW_RUNTIME_IMAGE:-neurosleep-airflow:phase10}
  pull_policy: never
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USERNAME:-admin}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/state/simple_auth_manager_passwords.json.generated"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}"
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET}"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    PROJECT_NAME: "${PROJECT_NAME:-neuro_sleep_lakehouse_platform}"
    ENV: "${ENV:-local}"
    POSTGRES_HOST: "postgres"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "${POSTGRES_DB}"
    POSTGRES_USER: "${POSTGRES_USER}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    MINIO_ENDPOINT: "http://minio:9000"
    MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
    MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
    DATA_PROFILE: "${DATA_PROFILE:-sample}"
    ACTIVE_SOURCE: "${ACTIVE_SOURCE:-sleep_edf}"
    SLEEP_EDF_VERSION: "${SLEEP_EDF_VERSION:-1.0.0}"
    SLEEP_EDF_MAX_RECORDINGS: "${SLEEP_EDF_MAX_RECORDINGS:-4}"
    SLEEP_EDF_INCLUDE_CASSETTE: "${SLEEP_EDF_INCLUDE_CASSETTE:-true}"
    SLEEP_EDF_INCLUDE_TELEMETRY: "${SLEEP_EDF_INCLUDE_TELEMETRY:-true}"
    SLEEP_EDF_INCLUDE_METADATA: "${SLEEP_EDF_INCLUDE_METADATA:-true}"
    SLEEP_EDF_RECORDING_KEYS: "${SLEEP_EDF_RECORDING_KEYS:-}"
    SILVER_INCLUDE_SIGNALS: "${SILVER_INCLUDE_SIGNALS:-true}"
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./logs/airflow:/opt/airflow/logs
    - airflow_state:/opt/airflow/state

services:
  airflow-init:
    <<: *airflow-common
    container_name: neuro_sleep_airflow_init
    restart: "no"
    command: ["bash", "-c", "airflow db migrate && airflow db check"]

  airflow-scheduler:
    <<: *airflow-common
    container_name: neuro_sleep_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    container_name: neuro_sleep_airflow_dag_processor
    restart: unless-stopped
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-api-server:
    <<: *airflow-common
    container_name: neuro_sleep_airflow_api_server
    restart: unless-stopped
    command: api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/v2/version >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  airflow_state:
